services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_powered_crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports:
      - "3307:3306"
    volumes:
      - crm_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: ./backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build: ./backend
    env_file: ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan queue:work --tries=3 --timeout=90

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  crm_mysql:
